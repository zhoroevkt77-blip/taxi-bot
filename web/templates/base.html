<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>{% block title %}ТАКСИ роБОТ{% endblock %}</title>
<style>
  /* ============================================================
     ТАКСИ роБОТ — сайттын стили
     WEB_VERSION = v12-cat-tag
     Түстөр: кара (тилке), сары (акцент), ак (карточкалар).
     ============================================================ */
  :root {
    --black: #16161a;
    --ink: #23232a;
    --yellow: #ffc61a;
    --yellow-2: #ffb703;
    --yellow-soft: #fff8e6;
    --grey: #8a8a95;
    --grey-2: #b9b9c2;
    --line: #ededf1;
    --bg: #f5f5f7;
    --wa: #25d366;
    --wa-2: #1da851;
    --tg: #34a9e0;
    --tg-2: #1d8ec4;
    --shadow: 0 2px 10px rgba(20,20,30,.06);
    --shadow-lg: 0 6px 20px rgba(20,20,30,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }

  /* ---- Башкы тилке ---- */
  .top {
    background: linear-gradient(160deg, #22222a 0%, var(--black) 70%);
    padding: 14px 14px 18px;
    border-radius: 0 0 20px 20px;
    max-width: 640px; margin: 0 auto;
  }
  .top-row {
    display: flex; align-items: center; gap: 8px;
    min-width: 0; flex-wrap: nowrap;
  }
  .logo {
    flex: 0 0 auto;
    font-size: 19px; font-weight: 900; color: #fff;
    letter-spacing: -.3px; line-height: 1.05;
    display: flex; align-items: center; gap: 6px;
  }
  .logo .car { font-size: 20px; line-height: 1; }
  .logo b { color: var(--yellow); }

  .ver {
    flex: 0 0 auto;
    font-size: 9.5px; font-weight: 800; color: var(--yellow);
    background: rgba(255,198,26,.16); border-radius: 7px;
    padding: 2px 5px; letter-spacing: .4px;
  }
  .chip-region {
    flex: 0 1 auto; min-width: 0;
    background: rgba(255,255,255,.11);
    color: #f0f0f4; font-size: 12.5px; font-weight: 600;
    padding: 7px 12px; border-radius: 22px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    backdrop-filter: blur(6px);
  }
  .chip-region .dot { color: var(--yellow); margin-right: 5px; font-size: 14px; }
  .lang {
    flex: 0 0 auto; margin-left: auto; display: flex;
    background: rgba(255,255,255,.11); border-radius: 22px; padding: 3px;
  }
  .lang a {
    padding: 6px 11px; border-radius: 18px;
    font-size: 12px; font-weight: 800; color: #a9a9b4;
    letter-spacing: .4px; transition: all .18s;
  }
  .lang a.on { background: #fff; color: var(--black); box-shadow: 0 1px 4px rgba(0,0,0,.2); }

  @media (max-width: 360px) {
    .chip-region { display: none; }
  }

  /* ---- Издөө сабы ---- */
  form.search {
    display: flex; margin-top: 15px; background: #fff;
    border-radius: 30px; padding: 5px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  form.search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    padding: 12px 16px; font-size: 15.5px; min-width: 0;
    font-family: inherit; color: var(--ink);
  }
  form.search input::placeholder { color: var(--grey-2); }
  form.search button {
    flex: 0 0 auto;
    border: 0; background: var(--black); color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 800;
    padding: 12px 22px; border-radius: 24px; cursor: pointer;
    transition: transform .12s;
  }
  form.search button:active { transform: scale(.96); }

  /* ---- Категория карточкалары ---- */
  .cats {
    display: flex; gap: 11px; overflow-x: auto;
    padding: 18px 16px 6px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 122px; min-height: 132px;
    background: #fff; border-radius: 18px;
    padding: 16px 10px 14px; text-align: center;
    border: 2px solid transparent;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center;
    transition: transform .15s, box-shadow .15s;
  }
  .cat:active { transform: scale(.97); }
  .cat.on {
    border-color: var(--yellow);
    background: var(--yellow-soft);
    box-shadow: var(--shadow-lg);
  }
  .cat .ico {
    font-size: 26px; line-height: 1;
    width: 52px; height: 52px; border-radius: 16px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; overflow: hidden;
  }
  .cat .ico.photo { background: var(--bg); padding: 0; position: relative; }
  .cat .ico.photo .fallback { width: 30px; height: 30px; display: block; }
  .cat .ico.photo img {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cat .ico svg { display: block; }
  .cat.on .ico { background: rgba(255,198,26,.28); }

  .cat .nm {
    font-size: 12.5px; font-weight: 700; line-height: 1.3;
    letter-spacing: -.1px; color: var(--ink);
  }
  .cat .n {
    display: block; margin-top: 6px;
    font-size: 13px; font-weight: 800; color: var(--grey);
  }
  .cat.on .n { color: #a07800; }

  /* ---- Бөлүм башы ---- */
  .head { display: flex; align-items: baseline; padding: 20px 2px 12px; }
  .head h2 { font-size: 22px; margin: 0; font-weight: 900; letter-spacing: -.5px; }
  .head .all {
    margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--grey);
    white-space: nowrap; padding-left: 10px;
  }

  /* ---- Облус чиптери ---- */
  .chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 2px 14px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: #fff;
    border: 1px solid var(--line); border-radius: 22px;
    padding: 10px 17px; font-size: 14px; font-weight: 700;
    white-space: nowrap; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .chip:active { transform: scale(.96); }
  .chip.on {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    border-color: transparent; color: var(--black);
    box-shadow: 0 3px 10px rgba(255,183,3,.35);
  }
  .chip .n { color: var(--grey); font-weight: 800; margin-left: 6px; font-size: 13px; }
  .chip.on .n { color: #7a5a00; }

  /* ---- Мазмун ---- */
  main { max-width: 640px; margin: 0 auto; padding: 2px 16px 108px; }

  /* ---- Багыт карточкасы ---- */
  .route {
    display: flex; flex-direction: column; align-items: stretch; gap: 9px;
    background: #fff; border-radius: 16px;
    padding: 14px 16px 16px; margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: transform .14s, box-shadow .14s;
  }
  .route:active { transform: scale(.985); box-shadow: var(--shadow-lg); }

  /* Багыттын категориясы — карточканын үстүндөгү кичине жазуу */
  .cat-tag {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 800; letter-spacing: .1px;
    padding: 4px 10px; border-radius: 9px;
    background: var(--bg); color: var(--grey);
  }
  .cat-tag svg { width: 13px; height: 13px; flex: 0 0 auto; }
  /* Ар бир категориянын өз түсү */
  .cat-tag.to    { background: #eaf4ff; color: #1f6fb2; }
  .cat-tag.from  { background: #fdf0e8; color: #b5642c; }
  .cat-tag.local { background: #eef7ee; color: #3d7a41; }

  .route-main { display: flex; align-items: center; }

  .route .path {
    font-weight: 800; font-size: 16px; letter-spacing: -.2px;
    display: flex; align-items: center; gap: 9px; min-width: 0;
  }
  .route .arrow {
    color: var(--yellow-2); font-size: 17px; font-weight: 900; flex: 0 0 auto;
  }
  .count {
    flex: 0 0 auto;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    color: var(--black); font-weight: 900; font-size: 14px;
    min-width: 34px; height: 34px; border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 11px; margin-left: auto;
    box-shadow: 0 2px 8px rgba(255,183,3,.4);
  }

  /* ---- Жарыя карточкасы ---- */
  .post {
    background: #fff; border-radius: 16px; padding: 17px;
    margin-bottom: 13px; box-shadow: var(--shadow);
  }
  .post.vip {
    border: 2px solid var(--yellow);
    box-shadow: 0 4px 16px rgba(255,183,3,.22);
  }

  .vip-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    font-size: 11px; font-weight: 900; letter-spacing: .4px;
    padding: 5px 11px; border-radius: 11px; margin-bottom: 12px;
    color: var(--black);
  }
  .vip-tag svg { display: block; flex: 0 0 auto; }

  /* ---- Аталышы бар маалымат саптары ----
     Ар бир сап: капкара белги + үстүндө боз аталыш + астында кара маани */
  .rows { font-size: 15px; }
  .rows .row-line {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .rows .row-line:last-child { border-bottom: 0; padding-bottom: 2px; }
  .rows .row-line:first-child { padding-top: 0; }

  /* Белги — капкара, бозомтук эмес */
  .rows .k-ico {
    width: 19px; height: 19px; flex: 0 0 auto;
    margin-top: 2px; color: var(--black);
  }

  .rows .rw {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
  }
  /* Аталыш — кичине, боз */
  .rows .k {
    font-size: 12px; font-weight: 700; color: var(--grey);
    letter-spacing: .1px;
  }
  /* Маани — кара, ачык окулат */
  .rows .v {
    font-size: 15px; font-weight: 700; color: var(--ink);
    line-height: 1.4; word-break: break-word;
  }
  .rows .v.big { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
  .rows .v.price { font-weight: 900; }

  /* ---- Байланыш баскычтары ---- */
  .phone-num {
    text-align: center; margin: 17px 0 11px;
    font-size: 21px; font-weight: 900; letter-spacing: -.4px;
    color: var(--ink);
  }
  .contacts { display: flex; gap: 9px; }
  .btn {
    flex: 1 1 0; min-width: 0;
    border: 0; border-radius: 14px;
    padding: 12px 4px 11px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 800; letter-spacing: -.2px;
    color: #fff; transition: transform .12s, filter .12s;
  }
  .btn span { white-space: nowrap; }
  .btn svg { width: 23px; height: 23px; display: block; flex: 0 0 auto; }
  .btn:active { transform: scale(.95); filter: brightness(.94); }

  .btn.call {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    color: var(--black);
    box-shadow: 0 3px 11px rgba(255,183,3,.4);
  }
  .btn.wa {
    background: linear-gradient(135deg, var(--wa) 0%, var(--wa-2) 100%);
    box-shadow: 0 3px 11px rgba(37,211,102,.35);
  }
  .btn.tg {
    background: linear-gradient(135deg, var(--tg) 0%, var(--tg-2) 100%);
    box-shadow: 0 3px 11px rgba(29,142,196,.35);
  }

  /* ---- Ички беттер ---- */
  .page-head { padding: 16px 0 16px; }
  .page-head h1 { font-size: 28px; margin: 0 0 8px; font-weight: 900; letter-spacing: -.7px; }
  .lead { color: var(--grey); font-size: 15px; line-height: 1.55; margin: 0; }

  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 18px 14px;
    border-radius: 16px; font-size: 16px; font-weight: 800;
    color: #fff; margin-bottom: 12px; letter-spacing: -.2px;
    transition: transform .13s;
  }
  .big-btn:active { transform: scale(.98); }
  .big-btn .brand { flex: 0 0 auto; }
  .big-btn.tg { background: linear-gradient(135deg, var(--tg) 0%, var(--tg-2) 100%);
                box-shadow: 0 4px 14px rgba(29,142,196,.32); }
  .big-btn.wa { background: linear-gradient(135deg, var(--wa) 0%, var(--wa-2) 100%);
                box-shadow: 0 4px 14px rgba(31,156,83,.32); }

  .info-card {
    background: #fff; border-radius: 16px; padding: 17px;
    font-size: 14.5px; line-height: 1.65; color: #55555f;
    margin-top: 16px; box-shadow: var(--shadow);
  }
  .info-card b { color: var(--ink); }

  /* Кабинеттеги саптар */
  .row-item {
    display: flex; align-items: center; gap: 13px;
    background: #fff; border-radius: 16px; padding: 17px 16px;
    margin-bottom: 10px; box-shadow: var(--shadow);
    transition: transform .13s;
  }
  .row-item:active { transform: scale(.985); }
  .row-item .ico {
    flex: 0 0 auto;
    font-size: 19px; width: 40px; height: 40px; border-radius: 13px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
  }
  .row-item .ico svg { width: 19px; height: 19px; color: var(--black); }
  .row-item .nm { font-weight: 700; font-size: 15.5px; letter-spacing: -.2px; }
  .row-item .chev { margin-left: auto; color: var(--grey-2); font-size: 24px; font-weight: 300; }

  /* Жардамдагы жыйылуучу бөлүмдөр */
  .acc {
    background: #fff; border-radius: 16px; margin-bottom: 10px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .acc summary {
    padding: 17px 16px; font-weight: 800; font-size: 15.5px;
    cursor: pointer; list-style: none; letter-spacing: -.2px;
    display: flex; align-items: center;
  }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after {
    content: "›"; margin-left: auto; color: var(--grey-2);
    font-size: 24px; font-weight: 300; transition: transform .2s;
  }
  .acc[open] summary { border-bottom: 1px solid var(--line); }
  .acc[open] summary::after { transform: rotate(90deg); }
  .acc-body {
    padding: 15px 16px 20px; font-size: 15px; line-height: 1.68;
    white-space: pre-wrap; word-wrap: break-word; color: #3d3d46;
  }
  .acc-body b { font-weight: 800; color: var(--ink); }

  /* ---- Бош абал ---- */
  .empty { text-align: center; padding: 56px 20px; color: var(--grey); }
  .empty .big {
    font-size: 46px; margin-bottom: 14px;
    display: flex; justify-content: center; color: var(--grey-2);
  }
  .back {
    display: inline-block; margin: 8px 0 10px;
    color: var(--grey); font-size: 15px; font-weight: 700;
  }

  /* ---- Ылдыйкы тилке ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: flex; align-items: flex-end;
    padding: 9px 4px calc(9px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto; z-index: 20;
  }
  .tab {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
    color: var(--grey); font-size: 10px; font-weight: 700;
    padding: 3px 1px; letter-spacing: -.1px; text-align: center;
    transition: color .16s;
  }
  .tab .i {
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s;
  }
  .tab .i svg { width: 23px; height: 23px; display: block; }
  .tab.on { color: var(--black); font-weight: 800; }
  .tab.on .i { transform: translateY(-1px); }
  .tab.on .i svg { stroke-width: 2.3; }

  .tab.add { color: var(--black); font-weight: 800; }
  .tab.add .i {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    width: 46px; height: 46px; border-radius: 50%;
    margin-top: -16px; color: var(--black);
    box-shadow: 0 4px 14px rgba(255,183,3,.5);
  }
  .tab.add .i svg { width: 25px; height: 25px; stroke-width: 2.6; }
  .tab.add:active .i { transform: scale(.94); }
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <div class="logo"><span class="car">🚕</span>ТАКСИ<b>роБОТ</b></div>
    <span class="ver">v12</span>
    <div class="chip-region"><span class="dot">•</span>{{ t('Кыргызстан', 'Кыргызстан') }}</div>
    <div class="lang">
      <a href="{{ lang_ky_url }}" class="{{ 'on' if lang == 'ky' else '' }}">KG</a>
      <a href="{{ lang_ru_url }}" class="{{ 'on' if lang == 'ru' else '' }}">RU</a>
    </div>
  </div>

  <form class="search" method="get" action="/">
    <input type="text" name="q" value="{{ q|default('') }}"
           placeholder="{{ t('Шаар же багыт издөө', 'Поиск города или направления') }}">
    <button type="submit">{{ t('Изде', 'Найти') }}</button>
  </form>
</div>

{% block cats %}{% endblock %}

<main>
  {% block content %}{% endblock %}
</main>

<nav class="tabbar">

  <a class="tab {{ 'on' if request.path == '/' else '' }}" href="/?lang={{ lang }}">
    <span class="i">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9.6V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.6"/>
        <path d="M9.5 21v-6h5v6"/>
      </svg>
    </span>{{ t('Башкы бет', 'Главная') }}
  </a>

  <a class="tab" href="{{ channel_url }}">
    <span class="i">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11v2a1 1 0 0 0 1 1h3l7 4.5V6.5L7 11H4a1 1 0 0 0-1 1z"/>
        <path d="M17.5 9a4 4 0 0 1 0 6"/>
        <path d="M20 6.5a7.5 7.5 0 0 1 0 11"/>
      </svg>
    </span>{{ t('Канал', 'Канал') }}
  </a>

  <a class="tab add {{ 'on' if request.path == '/post' else '' }}" href="/post?lang={{ lang }}">
    <span class="i">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </span>{{ t('Жарыя берүү', 'Объявление') }}
  </a>

  <a class="tab {{ 'on' if request.path == '/help' else '' }}" href="/help?lang={{ lang }}">
    <span class="i">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.3 9.2a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.4-2.7 4"/>
        <path d="M12 17.3h.01"/>
      </svg>
    </span>{{ t('Жардам', 'Помощь') }}
  </a>

  <a class="tab {{ 'on' if request.path == '/me' else '' }}" href="/me?lang={{ lang }}">
    <span class="i">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/>
        <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
      </svg>
    </span>{{ t('Кабинет', 'Кабинет') }}
  </a>

</nav>

</body>
</html>
