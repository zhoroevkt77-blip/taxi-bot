DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ТАКСИ роБОТ{% endblock %}</title>
<style>
  /* Такси түстөрү: кара — башкы тилке, сары — акцент, ак — фон */
  :root {
    --black: #1a1a1a;
    --yellow: #ffc61a;
    --yellow-dark: #e0a800;
    --grey: #6b6b6b;
    --line: #e8e8e8;
    --bg: #f6f6f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
    -webkit-text-size-adjust: 100%;
  }
  a { text-decoration: none; color: inherit; }

  /* ---- Башкы тилке ---- */
  header {
    background: var(--black);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
  .logo b { color: var(--yellow); }
  .checker {
    height: 6px;
    background:
      repeating-linear-gradient(90deg,
        var(--yellow) 0 14px, var(--black) 14px 28px);
  }
  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang a {
    padding: 5px 11px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: #bdbdbd;
    border: 1px solid #3a3a3a;
  }
  .lang a.on { background: var(--yellow); color: var(--black); border-color: var(--yellow); }

  /* ---- Мазмун ---- */
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 90px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--grey); font-size: 14px; margin-bottom: 18px; }
  h2 {
    font-size: 15px;
    margin: 24px 0 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--grey);
  }

  /* ---- Багыт карточкасы ---- */
  .route {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 15px;
    margin-bottom: 9px;
  }
  .route:active { background: #fafafa; }
  .route .path { font-weight: 600; font-size: 16px; }
  .route .arrow { color: var(--yellow-dark); margin: 0 7px; }
  .count {
    margin-left: auto;
    background: var(--yellow);
    color: var(--black);
    font-weight: 700;
    font-size: 13px;
    padding: 4px 11px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ---- Жарыя карточкасы ---- */
  .post {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
  }
  .post.vip { border-color: var(--yellow); border-width: 2px; }
  .vip-tag {
    display: inline-block;
    background: var(--yellow);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .post .who { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .post .car { color: var(--grey); font-size: 14px; margin-bottom: 11px; }
  .rows { font-size: 15px; line-height: 1.65; }
  .rows .k { color: var(--grey); }
  .price { font-weight: 700; }
  .note {
    margin-top: 9px;
    padding: 9px 11px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 14px;
    color: #444;
  }

  /* ---- Байланыш баскычтары ---- */
  .contacts { display: flex; gap: 8px; margin-top: 13px; }
  .btn {
    flex: 1;
    text-align: center;
    padding: 11px 6px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: #fff;
  }
  .btn.call { background: var(--yellow); border-color: var(--yellow); }
  .btn:active { opacity: .75; }

  /* ---- Бош абал ---- */
  .empty {
    text-align: center;
    padding: 44px 20px;
    color: var(--grey);
  }
  .empty .big { font-size: 40px; margin-bottom: 12px; }

  .back { display: inline-block; margin-bottom: 14px; color: var(--grey); font-size: 15px; }

  /* ---- Ылдыйкы тилке ---- */
  .bottom {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    max-width: 640px;
    margin: 0 auto;
  }
  .bottom a {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 14px;
  }
  .bottom .primary { background: var(--yellow); color: var(--black); }
  .bottom .ghost { background: var(--black); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="logo">🚕 ТАКСИ <b>роБОТ</b></div>
  <div class="lang">
    <a href="?{{ qs }}lang=ky" class="{{ 'on' if lang == 'ky' else '' }}">KG</a>
    <a href="?{{ qs }}lang=ru" class="{{ 'on' if lang == 'ru' else '' }}">RU</a>
  </div>
</header>
<div class="checker"></div>

<main>
  {% block content %}{% endblock %}
</main>

<div class="bottom">
  <a class="primary" href="{{ bot_url }}">{{ t('📝 Жарыя берүү', '📝 Дать объявление') }}</a>
  <a class="ghost" href="{{ channel_url }}">{{ t('📢 Канал', '📢 Канал') }}</a>
</div>

</body>
</html>
