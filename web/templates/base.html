<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ТАКСИ роБОТ{% endblock %}</title>
<style>
  /* Түзүлүшү ТАП! сайтындай, түстөрү такси: кара — тилке, сары — акцент */
  :root {
    --black: #1c1c1c;
    --yellow: #ffc61a;
    --yellow-soft: #fff6dd;
    --grey: #7a7a7a;
    --line: #ececec;
    --bg: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
    -webkit-text-size-adjust: 100%;
  }
  a { text-decoration: none; color: inherit; }

  /* ---- Башкы тилке ---- */
  .top { background: var(--black); padding: 12px 14px 16px; }
  .top-row { display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 21px; font-weight: 800; color: #fff; letter-spacing: .3px; }
  .logo b { color: var(--yellow); }
  .chip-region {
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .chip-region .dot { color: var(--yellow); margin-right: 5px; }
  .lang { margin-left: auto; display: flex; background: rgba(255,255,255,.12); border-radius: 20px; padding: 3px; }
  .lang a { padding: 5px 12px; border-radius: 16px; font-size: 13px; font-weight: 700; color: #cfcfcf; }
  .lang a.on { background: #fff; color: var(--black); }

  /* ---- Издөө сабы ---- */
  form.search { display: flex; margin-top: 14px; background: #fff; border-radius: 26px; padding: 5px; }
  form.search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    padding: 11px 14px; font-size: 16px; min-width: 0;
  }
  form.search button {
    border: 0; background: var(--black); color: #fff;
    font-size: 15px; font-weight: 700;
    padding: 11px 22px; border-radius: 22px;
  }

  /* ---- Категория карточкалары ---- */
  .cats { display: flex; gap: 10px; overflow-x: auto; padding: 16px 14px 4px; -webkit-overflow-scrolling: touch; }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 128px;
    background: #fff;
    border-radius: 14px;
    padding: 14px 10px 12px;
    text-align: center;
    border: 2px solid transparent;
  }
  .cat.on { border-color: var(--black); background: var(--yellow-soft); }
  .cat .ico { font-size: 30px; line-height: 1; margin-bottom: 9px; }
  .cat .nm { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .cat .n { display: block; margin-top: 4px; font-size: 12px; color: var(--grey); font-weight: 600; }

  /* ---- Бөлүм башы ---- */
  .head { display: flex; align-items: baseline; padding: 20px 14px 10px; }
  .head h2 { font-size: 21px; margin: 0; font-weight: 800; }
  .head .all { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--grey); }

  /* ---- Облус чиптери ---- */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 6px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .chip.on { background: var(--yellow); border-color: var(--yellow); }
  .chip .n { color: var(--grey); font-weight: 700; margin-left: 5px; }
  .chip.on .n { color: #7a5f00; }

  /* ---- Мазмун ---- */
  main { max-width: 640px; margin: 0 auto; padding: 6px 14px 92px; }

  .route {
    display: flex; align-items: center;
    background: #fff; border: 1px solid var(--line);
    border-radius: 13px; padding: 15px; margin-bottom: 9px;
  }
  .route:active { background: #fafafa; }
  .route .path { font-weight: 700; font-size: 16px; }
  .route .arrow { color: #c99b00; margin: 0 7px; }
  .count {
    margin-left: auto; background: var(--yellow); color: var(--black);
    font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 20px;
  }

  /* ---- Жарыя карточкасы ---- */
  .post { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 15px; margin-bottom: 12px; }
  .post.vip { border-color: var(--yellow); border-width: 2px; }
  .vip-tag { display: inline-block; background: var(--yellow); font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 10px; margin-bottom: 8px; }
  .post .who { font-size: 17px; font-weight: 800; margin-bottom: 3px; }
  .post .car { color: var(--grey); font-size: 14px; margin-bottom: 11px; }
  .rows { font-size: 15px; line-height: 1.65; }
  .rows .k { color: var(--grey); }
  .price { font-weight: 800; }
  .note { margin-top: 9px; padding: 9px 11px; background: var(--bg); border-radius: 8px; font-size: 14px; color: #444; }
  .contacts { display: flex; gap: 8px; margin-top: 13px; }
  .btn { flex: 1; text-align: center; padding: 11px 6px; border-radius: 9px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: #fff; }
  .btn.call { background: var(--yellow); border-color: var(--yellow); }
  .btn:active { opacity: .75; }

  .empty { text-align: center; padding: 44px 20px; color: var(--grey); }
  .empty .big { font-size: 42px; margin-bottom: 12px; }
  .back { display: inline-block; margin: 4px 0 12px; color: var(--grey); font-size: 15px; font-weight: 600; }

  /* ---- Ылдыйкы тилке ---- */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; max-width: 640px; margin: 0 auto;
  }
  .bottom a { flex: 1; text-align: center; padding: 12px 6px; border-radius: 9px; font-weight: 800; font-size: 14px; }
  .bottom .primary { background: var(--yellow); }
  .bottom .ghost { background: var(--black); color: #fff; }
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <div class="logo">🚕 ТАКСИ<b>роБОТ</b></div>
    <div class="chip-region"><span class="dot">•</span>{{ t('Кыргызстан', 'Кыргызстан') }}</div>
    <div class="lang">
      <a href="{{ lang_ky_url }}" class="{{ 'on' if lang == 'ky' else '' }}">KG</a>
      <a href="{{ lang_ru_url }}" class="{{ 'on' if lang == 'ru' else '' }}">RU</a>
    </div>
  </div>

  <form class="search" method="get" action="/">
    <input type="text" name="q" value="{{ q|default('') }}"
           placeholder="{{ t('Шаар же багыт издөө', 'Поиск города или направления') }}">
    <button type="submit">{{ t('Изде', 'Найти') }}</button>
  </form>
</div>

{% block cats %}{% endblock %}

<main>
  {% block content %}{% endblock %}
</main>

<div class="bottom">
  <a class="primary" href="{{ bot_url }}">{{ t('📝 Жарыя берүү', '📝 Дать объявление') }}</a>
  <a class="ghost" href="{{ channel_url }}">{{ t('📢 Канал', '📢 Канал') }}</a>
</div>

</body>
</html>
