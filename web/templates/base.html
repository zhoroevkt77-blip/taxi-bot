<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ТАКСИ роБОТ{% endblock %}</title>
<style>
  /* ============================================================
     ТАКСИ роБОТ — сайттын стили
     Түстөр: кара (тилке), сары (акцент), ак (карточкалар).
     Түзүлүшү ТАП!тикиндей, бирок такси түстөрү менен.
     ============================================================ */
  :root {
    --black: #16161a;
    --ink: #23232a;
    --yellow: #ffc61a;
    --yellow-2: #ffb703;
    --yellow-soft: #fff8e6;
    --grey: #8a8a95;
    --grey-2: #b9b9c2;
    --line: #ededf1;
    --bg: #f5f5f7;
    --shadow: 0 2px 10px rgba(20,20,30,.06);
    --shadow-lg: 0 6px 20px rgba(20,20,30,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }

  /* ---- Башкы тилке ---- */
  .top {
    background: linear-gradient(160deg, #22222a 0%, var(--black) 70%);
    padding: 14px 16px 18px;
    border-radius: 0 0 20px 20px;
  }
  .top-row { display: flex; align-items: center; gap: 10px; }
  .logo {
    font-size: 20px; font-weight: 900; color: #fff;
    letter-spacing: -.3px; line-height: 1.05;
  }
  .logo .car { display: block; font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .logo b { color: var(--yellow); }
  .chip-region {
    background: rgba(255,255,255,.11);
    color: #f0f0f4; font-size: 13.5px; font-weight: 600;
    padding: 8px 15px; border-radius: 22px; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  .chip-region .dot { color: var(--yellow); margin-right: 6px; font-size: 15px; }
  .lang {
    margin-left: auto; display: flex;
    background: rgba(255,255,255,.11); border-radius: 22px; padding: 3px;
  }
  .lang a {
    padding: 6px 13px; border-radius: 18px;
    font-size: 12.5px; font-weight: 800; color: #a9a9b4;
    letter-spacing: .4px; transition: all .18s;
  }
  .lang a.on { background: #fff; color: var(--black); box-shadow: 0 1px 4px rgba(0,0,0,.2); }

  /* ---- Издөө сабы ---- */
  form.search {
    display: flex; margin-top: 15px; background: #fff;
    border-radius: 30px; padding: 5px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  form.search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    padding: 12px 16px; font-size: 15.5px; min-width: 0;
    font-family: inherit; color: var(--ink);
  }
  form.search input::placeholder { color: var(--grey-2); }
  form.search button {
    border: 0; background: var(--black); color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 800;
    padding: 12px 24px; border-radius: 24px; cursor: pointer;
    transition: transform .12s;
  }
  form.search button:active { transform: scale(.96); }

  /* ---- Категория карточкалары ---- */
  .cats {
    display: flex; gap: 11px; overflow-x: auto;
    padding: 18px 16px 6px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 122px; min-height: 132px;
    background: #fff; border-radius: 18px;
    padding: 16px 10px 14px; text-align: center;
    border: 2px solid transparent;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center;
    transition: transform .15s, box-shadow .15s;
  }
  .cat:active { transform: scale(.97); }
  .cat.on {
    border-color: var(--yellow);
    background: var(--yellow-soft);
    box-shadow: var(--shadow-lg);
  }
  .cat .ico {
    font-size: 26px; line-height: 1;
    width: 50px; height: 50px; border-radius: 16px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
  }
  .cat.on .ico { background: rgba(255,198,26,.28); }
  .cat .nm {
    font-size: 12.5px; font-weight: 700; line-height: 1.3;
    letter-spacing: -.1px; color: var(--ink);
  }
  .cat .n {
    display: block; margin-top: 6px;
    font-size: 13px; font-weight: 800; color: var(--grey);
  }
  .cat.on .n { color: #a07800; }

  /* ---- Бөлүм башы ---- */
  .head { display: flex; align-items: baseline; padding: 20px 2px 12px; }
  .head h2 {
    font-size: 22px; margin: 0; font-weight: 900; letter-spacing: -.5px;
  }
  .head .all {
    margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--grey);
  }

  /* ---- Облус чиптери ---- */
  .chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 2px 14px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: #fff;
    border: 1px solid var(--line); border-radius: 22px;
    padding: 10px 17px; font-size: 14px; font-weight: 700;
    white-space: nowrap; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .chip:active { transform: scale(.96); }
  .chip.on {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    border-color: transparent; color: var(--black);
    box-shadow: 0 3px 10px rgba(255,183,3,.35);
  }
  .chip .n { color: var(--grey); font-weight: 800; margin-left: 6px; font-size: 13px; }
  .chip.on .n { color: #7a5a00; }

  /* ---- Мазмун ---- */
  main { max-width: 640px; margin: 0 auto; padding: 2px 16px 108px; }

  /* ---- Багыт карточкасы ---- */
  .route {
    display: flex; align-items: center;
    background: #fff; border-radius: 16px;
    padding: 17px 16px; margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: transform .14s, box-shadow .14s;
  }
  .route:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
  .route .path {
    font-weight: 800; font-size: 16px; letter-spacing: -.2px;
    display: flex; align-items: center; gap: 9px;
  }
  .route .arrow {
    color: var(--yellow-2); font-size: 17px; font-weight: 900;
  }
  .count {
    margin-left: auto;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    color: var(--black); font-weight: 900; font-size: 14px;
    min-width: 34px; height: 34px; border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 11px;
    box-shadow: 0 2px 8px rgba(255,183,3,.4);
  }

  /* ---- Жарыя карточкасы ---- */
  .post {
    background: #fff; border-radius: 16px; padding: 17px;
    margin-bottom: 13px; box-shadow: var(--shadow);
  }
  .post.vip {
    border: 2px solid var(--yellow);
    box-shadow: 0 4px 16px rgba(255,183,3,.22);
  }
  .vip-tag {
    display: inline-block;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    font-size: 11px; font-weight: 900; letter-spacing: .4px;
    padding: 4px 11px; border-radius: 11px; margin-bottom: 10px;
  }
  .post .who { font-size: 18px; font-weight: 900; letter-spacing: -.3px; margin-bottom: 4px; }
  .post .car { color: var(--grey); font-size: 14px; font-weight: 600; margin-bottom: 13px; }
  .rows { font-size: 15px; line-height: 1.75; }
  .rows .k { color: var(--grey); font-weight: 600; }
  .price { font-weight: 900; color: var(--ink); }
  .note {
    margin-top: 11px; padding: 11px 13px; background: var(--bg);
    border-radius: 11px; font-size: 14px; color: #55555f; line-height: 1.5;
  }
  .contacts { display: flex; gap: 8px; margin-top: 15px; }
  .btn {
    flex: 1; text-align: center; padding: 13px 6px; border-radius: 12px;
    font-size: 14px; font-weight: 800; border: 1px solid var(--line);
    background: #fff; transition: transform .12s;
  }
  .btn:active { transform: scale(.96); }
  .btn.call {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    border-color: transparent; box-shadow: 0 3px 10px rgba(255,183,3,.35);
  }

  /* ---- Ички беттер ---- */
  .page-head { padding: 16px 0 16px; }
  .page-head h1 { font-size: 28px; margin: 0 0 8px; font-weight: 900; letter-spacing: -.7px; }
  .lead { color: var(--grey); font-size: 15px; line-height: 1.55; margin: 0; }

  .big-btn {
    display: block; text-align: center; padding: 18px 14px;
    border-radius: 16px; font-size: 16px; font-weight: 800;
    color: #fff; margin-bottom: 12px; letter-spacing: -.2px;
    transition: transform .13s;
  }
  .big-btn:active { transform: scale(.98); }
  .big-btn.tg { background: linear-gradient(135deg, #34a9e0 0%, #1d8ec4 100%);
                box-shadow: 0 4px 14px rgba(29,142,196,.32); }
  .big-btn.wa { background: linear-gradient(135deg, #2fbe6a 0%, #1f9c53 100%);
                box-shadow: 0 4px 14px rgba(31,156,83,.32); }

  .info-card {
    background: #fff; border-radius: 16px; padding: 17px;
    font-size: 14.5px; line-height: 1.65; color: #55555f;
    margin-top: 16px; box-shadow: var(--shadow);
  }
  .info-card b { color: var(--ink); }

  /* Кабинеттеги саптар */
  .row-item {
    display: flex; align-items: center; gap: 13px;
    background: #fff; border-radius: 16px; padding: 17px 16px;
    margin-bottom: 10px; box-shadow: var(--shadow);
    transition: transform .13s;
  }
  .row-item:active { transform: scale(.985); }
  .row-item .ico {
    font-size: 19px; width: 40px; height: 40px; border-radius: 13px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
  }
  .row-item .nm { font-weight: 700; font-size: 15.5px; letter-spacing: -.2px; }
  .row-item .chev { margin-left: auto; color: var(--grey-2); font-size: 24px; font-weight: 300; }

  /* Жардамдагы жыйылуучу бөлүмдөр */
  .acc {
    background: #fff; border-radius: 16px; margin-bottom: 10px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .acc summary {
    padding: 17px 16px; font-weight: 800; font-size: 15.5px;
    cursor: pointer; list-style: none; letter-spacing: -.2px;
    display: flex; align-items: center;
  }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after {
    content: "›"; margin-left: auto; color: var(--grey-2);
    font-size: 24px; font-weight: 300; transition: transform .2s;
  }
  .acc[open] summary { border-bottom: 1px solid var(--line); }
  .acc[open] summary::after { transform: rotate(90deg); }
  .acc-body {
    padding: 15px 16px 20px; font-size: 15px; line-height: 1.68;
    white-space: pre-wrap; word-wrap: break-word; color: #3d3d46;
  }
  .acc-body b { font-weight: 800; color: var(--ink); }

  /* ---- Бош абал ---- */
  .empty { text-align: center; padding: 56px 20px; color: var(--grey); }
  .empty .big { font-size: 46px; margin-bottom: 14px; }
  .back {
    display: inline-block; margin: 8px 0 10px;
    color: var(--grey); font-size: 15px; font-weight: 700;
  }

  /* ---- Ылдыйкы тилке ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: flex; align-items: flex-end;
    padding: 9px 4px calc(9px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto; z-index: 20;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    color: var(--grey-2); font-size: 10.5px; font-weight: 700;
    padding: 3px 2px; letter-spacing: -.1px;
    transition: color .16s;
  }
  .tab .i { font-size: 21px; line-height: 1; transition: transform .16s; }
  .tab.on { color: var(--ink); font-weight: 800; }
  .tab.on .i { transform: translateY(-1px) scale(1.08); }
  .tab.add { color: var(--ink); font-weight: 800; }
  .tab.add .i {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-2) 100%);
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-top: -16px; font-size: 25px;
    box-shadow: 0 4px 14px rgba(255,183,3,.5);
  }
  .tab.add:active .i { transform: scale(.94); }
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <div class="logo"><span class="car">🚕</span>ТАКСИ<b>роБОТ</b></div>
    <div class="chip-region"><span class="dot">•</span>{{ t('Кыргызстан', 'Кыргызстан') }}</div>
    <div class="lang">
      <a href="{{ lang_ky_url }}" class="{{ 'on' if lang == 'ky' else '' }}">KG</a>
      <a href="{{ lang_ru_url }}" class="{{ 'on' if lang == 'ru' else '' }}">RU</a>
    </div>
  </div>

  <form class="search" method="get" action="/">
    <input type="text" name="q" value="{{ q|default('') }}"
           placeholder="{{ t('Шаар же багыт издөө', 'Поиск города или направления') }}">
    <button type="submit">{{ t('Изде', 'Найти') }}</button>
  </form>
</div>

{% block cats %}{% endblock %}

<main>
  {% block content %}{% endblock %}
</main>

<nav class="tabbar">
  <a class="tab {{ 'on' if request.path == '/' else '' }}" href="/?lang={{ lang }}">
    <span class="i">🏠</span>{{ t('Башкы бет', 'Главная') }}
  </a>
  <a class="tab" href="{{ channel_url }}">
    <span class="i">📢</span>{{ t('Канал', 'Канал') }}
  </a>
  <a class="tab add {{ 'on' if request.path == '/post' else '' }}" href="/post?lang={{ lang }}">
    <span class="i">➕</span>{{ t('Жарыя берүү', 'Объявление') }}
  </a>
  <a class="tab {{ 'on' if request.path == '/help' else '' }}" href="/help?lang={{ lang }}">
    <span class="i">❓</span>{{ t('Жардам', 'Помощь') }}
  </a>
  <a class="tab {{ 'on' if request.path == '/me' else '' }}" href="/me?lang={{ lang }}">
    <span class="i">👤</span>{{ t('Кабинет', 'Кабинет') }}
  </a>
</nav>

</body>
</html>
